<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="robots" content="noindex,nofollow">
  <title>Track Order | Shreeyanvi Suppliers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#090909;--panel:#111;--line:#292929;--muted:#999;--white:#f4f4f1;--accent:#d7f36a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1c2114 0,transparent 48%),var(--bg);color:var(--white);font:14px/1.6 "DM Sans",sans-serif;padding:24px}
    main{width:min(620px,100%);margin:5vh auto}.brand{display:flex;align-items:center;gap:11px;margin-bottom:30px}.mark{width:38px;height:38px;border:1px solid #555;border-radius:50%;display:grid;place-items:center;font:800 20px Manrope}.mark span{color:var(--accent)}.brand-name{font:800 12px Manrope;letter-spacing:.13em}.brand-name small{display:block;color:#888;font:8px "DM Sans";letter-spacing:.28em}
    .panel{background:#111;border:1px solid var(--line);padding:25px;box-shadow:0 24px 80px #0008}.eyebrow{font-size:9px;font-weight:700;letter-spacing:.2em;color:#aaa}.eyebrow:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 9px 1px 0}h1{font:600 32px/1.15 Manrope;letter-spacing:-.06em;margin:14px 0 5px}h1 em{font-style:normal;color:var(--accent)}.muted{color:var(--muted);font-size:12px}.status{padding:15px;margin:20px 0;border:1px solid #46502e;background:#15190f}.status strong{display:block;color:var(--accent);font:700 17px Manrope}.section{margin-top:24px}.section h2{font:700 14px Manrope;margin:0 0 10px}.items{padding:12px;background:#0b0b0b;border:1px solid #292929;font-size:12px}.timeline{display:grid;gap:0}.step{position:relative;padding:0 0 18px 26px;border-left:1px solid #414141;margin-left:7px}.step:last-child{border-left-color:transparent;padding-bottom:0}.dot{position:absolute;left:-5px;top:3px;width:9px;height:9px;border-radius:50%;background:#555;border:2px solid #111}.step.current .dot{background:var(--accent);box-shadow:0 0 0 3px #d7f36a22}.step strong{display:block;font-size:12px}.step small{color:#888;font-size:10px}.message{padding:24px;text-align:center;color:#aaa;font-size:12px}.back{display:inline-block;margin-top:18px;color:#aaa;text-decoration:none;font-size:11px}.back:hover{color:var(--accent)}@media(max-width:480px){body{padding:15px}.panel{padding:19px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark">S<span>.</span></div><div class="brand-name">SHREEYANVI <small>SUPPLIERS · ORDER TRACKING</small></div></div>
    <section class="panel">
      <div class="eyebrow">ORDER TRACKING</div><h1>Your order <em>journey.</em></h1>
      <p class="muted">This private page shows the latest status shared by Shreeyanvi Suppliers.</p>
      <div id="tracking-content" class="message">Checking your tracking link…</div>
    </section>
    <a class="back" href="index.html">← Back to Shreeyanvi Suppliers</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="track.js" defer></script>
</body>
</html>
